[package]
name = "jev"
version = "0.1.0"
edition = "2024"
description = "Unofficial, provider-neutral CLI for TypeSafe Jev"
license = "MIT"
repository = "https://github.com/polidog/jev"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3", features = ["json"] }
